       LA TRACE — le motif graphique du site.

       Un relevé de supervision : une ligne de base plate, et des
       événements dessus. C'est l'équivalent AMN du trait tracé à la
       main : ça vient du métier, ça n'est pas un ornement plaqué.

       Elle est IRRÉGULIÈRE exprès. Les pics n'ont ni la même hauteur,
       ni le même espacement, et il y a un long calme au milieu. Une
       sinusoïde régulière ferait décoration ; un vrai relevé, non.

       Servie en masque CSS (voir .trace dans site.css), donc la couleur
       vient de la feuille de style et pas d'ici.
       ================================================================ -->
